name: SFTP Diagnostic (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -y && sudo apt-get install -y sshpass

      - name: Read-only SFTP directory listing
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          cat > batch.txt <<'EOF'
          pwd
          ls -la
          -ls -la memory-staging
          -ls -la memory
          -ls -la /memory-staging
          -ls -la /memory
          EOF
          sshpass -p "$SFTP_PASSWORD" sftp -oStrictHostKeyChecking=no -oBatchMode=no -P 22 -b batch.txt "$SFTP_USERNAME@$SFTP_HOST"
