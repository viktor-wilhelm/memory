<div class="board__exit-confirm-overlay">
  <div class="board__exit-confirm-card board__exit-confirm-card--{{animation}}">
    <p class="board__exit-confirm-title">Are you sure you want to quit the game?</p>
    <div class="board__exit-confirm-actions">
      <button type="button" class="btn-action board__exit-confirm-cancel">{{cancelLabel}}</button>
      <button type="button" class="btn-action board__exit-confirm-confirm board__exit-confirm-confirm--{{confirmStyle}}">{{confirmLabel}}</button>
    </div>
  </div>
</div>
